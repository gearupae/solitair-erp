{% comment %}Shared operations module navigation. Set active_tab to: list, calendar, dashboard{% endcomment %}
<a href="{% url 'operations:schedule_list' %}" class="btn btn-outline-secondary{% if active_tab == 'list' %} active{% endif %}">
    <i class="fas fa-list me-1"></i>List
</a>
<a href="{% url 'operations:schedule_calendar' %}" class="btn btn-outline-primary{% if active_tab == 'calendar' %} active{% endif %}">
    <i class="fas fa-calendar-alt me-1"></i>Calendar
</a>
<a href="{% url 'operations:schedule_dashboard' %}" class="btn btn-outline-primary{% if active_tab == 'dashboard' %} active{% endif %}">
    <i class="fas fa-chart-pie me-1"></i>Dashboard
</a>
