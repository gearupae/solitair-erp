<style>
    @page {
        size: A4;
        margin: 14mm;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --ink: #0a0a0a;
        --ink-soft: #1a1a1a;
        --graphite: #2a2a2a;
        --silver: #a3a3a3;
        --mist: #e5e5e5;
        --paper: #fafafa;
        --white: #ffffff;
    }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 11px;
        line-height: 1.45;
        color: var(--ink-soft);
        background: var(--white);
    }

    .estimate-container {
        max-width: 210mm;
        margin: 0 auto;
        padding: 16px 16px 28px;
        background: var(--white);
    }

    .addr-grid {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        border: 1px solid var(--mist);
        background: var(--paper);
    }

    .addr-block {
        flex: 1;
        padding: 14px 16px;
        min-width: 0;
    }

    .addr-block + .addr-block {
        border-left: 1px solid var(--mist);
    }

    .addr-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--silver);
        margin-bottom: 10px;
        font-weight: 700;
    }

    .addr-from-logo {
        max-height: 56px;
        max-width: 200px;
        margin-bottom: 10px;
        object-fit: contain;
    }

    .addr-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 6px;
    }

    .addr-lines {
        font-size: 10px;
        color: #404040;
        line-height: 1.55;
    }

    .addr-lines .trn {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed #ccc;
        font-weight: 600;
        color: var(--ink);
    }

    .title-strip {
        background: #153a5c;
        color: var(--white);
        padding: 16px 18px;
        margin-bottom: 16px;
        border: 1px solid #0c2840;
    }

    .title-strip-main {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }

    .estimate-title-text {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.2;
        color: #f1f5f9;
    }

    .estimate-number {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #e2e8f0;
    }

    .addr-to-estimate-details {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed #ccc;
    }

    .addr-to-estimate-details .addr-label {
        margin-bottom: 8px;
    }

    .addr-to-detail-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        font-size: 9px;
        border-bottom: 1px solid #eee;
    }

    .addr-to-detail-row:last-child {
        border-bottom: none;
    }

    .addr-to-detail-label {
        color: #737373;
        flex-shrink: 0;
    }

    .addr-to-detail-value {
        font-weight: 600;
        color: #404040;
        text-align: right;
    }

    .items-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 18px;
    }

    .items-table thead th {
        background: #153a5c;
        color: #f5f5f5;
        padding: 9px 6px;
        text-align: left;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border: 1px solid #0c2840;
    }

    .items-table thead th.text-center { text-align: center; }
    .items-table thead th.text-right { text-align: right; }

    .items-table tbody td {
        padding: 8px 6px;
        border-bottom: 1px solid #e8e8e8;
        font-size: 10px;
    }

    .items-table tbody td.text-center { text-align: center; }
    .items-table tbody td.text-right { text-align: right; font-variant-numeric: tabular-nums; }

    .items-table tbody tr:nth-child(even) {
        background: #f7f7f7;
    }

    .item-number { color: #737373; font-size: 9px; }
    .item-description { font-weight: 500; }

    .totals-section {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 16px;
    }

    .totals-table {
        width: 300px;
    }

    .totals-row {
        display: flex;
        justify-content: space-between;
        padding: 7px 12px;
        border-bottom: 1px solid #e5e5e5;
        font-size: 10px;
    }

    .totals-row.subtotal { background: #f5f5f5; }
    .totals-row.vat-row { background: #ececec; }

    .totals-row.total {
        background: #153a5c;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        border: 1px solid #0c2840;
    }

    .totals-row.total .totals-label {
        color: #e8eef5;
    }

    .totals-row.total .totals-value {
        color: #fff;
    }

    .totals-label { color: #525252; }
    .totals-value { font-variant-numeric: tabular-nums; font-weight: 600; }

    .amount-words {
        background: #f0f0f0;
        border: 1px solid #ddd;
        padding: 12px;
        margin-bottom: 16px;
        font-size: 10px;
    }

    .amount-words-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #525252;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .notes-section {
        margin-bottom: 16px;
    }

    .notes-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #525252;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .notes-content {
        background: #fafafa;
        border: 1px solid #e5e5e5;
        padding: 10px 12px;
        font-size: 10px;
        line-height: 1.55;
    }

    .doc-footer {
        margin-top: 28px;
        padding-top: 12px;
        border-top: 1px solid #d4d4d4;
        font-size: 9px;
        color: #525252;
    }

    .doc-footer-line {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 6px;
    }

    .doc-footer-company {
        flex: 1;
        min-width: 200px;
        line-height: 1.5;
    }

    .doc-footer-company strong {
        color: #171717;
        font-size: 10px;
    }

    .doc-footer-page {
        font-variant-numeric: tabular-nums;
        color: #737373;
        white-space: nowrap;
    }

    @media print {
        body {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .no-print { display: none !important; }
        .estimate-container { padding: 0; max-width: none; }
    }

    .print-actions {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 10px;
        z-index: 1000;
    }

    .print-btn {
        padding: 10px 18px;
        border: 1px solid #0c2840;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        background: #153a5c;
        color: #fff;
    }

    .print-btn-secondary {
        background: #f5f5f5;
        color: #333;
    }
</style>
