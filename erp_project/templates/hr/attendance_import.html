{% extends 'base.html' %}
{% block content %}
<div class="page-header mb-4">
    <h4 class="mb-1 fw-bold">{{ title }}</h4>
    <p class="text-muted mb-0">Upload a CSV with columns <code>employee_code</code>, <code>date</code> (YYYY-MM-DD), optional <code>check_in</code> / <code>check_out</code> (HH:MM or HH:MM:SS). Weekends and configured holidays are skipped.</p>
</div>
<div class="card"><div class="card-body">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="step" value="preview" />
        <div class="mb-3">
            <label class="form-label">CSV file</label>
            <input type="file" name="file" accept=".csv,text/csv" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary">Preview import</button>
        <a href="{% url 'hr:attendance_list' %}" class="btn btn-light">Back</a>
    </form>
</div></div>
{% endblock %}
