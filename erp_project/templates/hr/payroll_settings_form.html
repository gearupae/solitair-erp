{% extends 'base.html' %}
{% block content %}
<div class="page-header mb-4"><h4 class="mb-1 fw-bold">{{ title }}</h4><p class="text-muted mb-0">Attendance deductions &amp; payroll defaults</p></div>
<div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}
        <div class="row g-3">
            {% for field in form %}
            <div class="col-md-6">{{ field.label_tag }} {{ field.errors }} {{ field }}</div>
            {% endfor %}
        </div>
        <button class="btn btn-primary mt-3" type="submit">Save</button>
        <a href="{% url 'hr:dashboard' %}" class="btn btn-light mt-3">Cancel</a>
    </form>
</div></div>
{% endblock %}
