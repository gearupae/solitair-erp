{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-2">
            <li class="breadcrumb-item"><a href="{% url 'hr:dashboard' %}">HR</a></li>
            <li class="breadcrumb-item active">Reports</li>
        </ol>
    </nav>
    <h4 class="mb-1 fw-bold">Reports</h4>
    <p class="text-muted mb-0">Employee, payroll, attendance, leave, and project allocation reports</p>
</div>

<div class="row g-4">
    {% for report in reports %}
    <div class="col-md-6 col-xl-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body d-flex flex-column">
                <div class="mb-3">
                    <span class="badge bg-primary-subtle text-primary mb-2">HR</span>
                    <h5 class="fw-bold mb-2">{{ report.title }}</h5>
                    <p class="text-muted mb-0 small">{{ report.description }}</p>
                </div>
                <div class="mt-auto">
                    <a href="{% url report.url_name %}" class="btn btn-primary btn-sm">
                        <i class="fas {{ report.icon }} me-2"></i>Open {{ report.title }}
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
