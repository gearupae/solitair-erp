{% extends 'base.html' %}
{% block content %}
<div class="page-header mb-4"><h4 class="mb-1 fw-bold">Deactivate template</h4></div>
<div class="card"><div class="card-body">
    <p>Deactivate <strong>{{ object.name }}</strong>?</p>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-warning">Deactivate</button>
        <a href="{% url 'hr:payroll_template_list' %}" class="btn btn-light">Cancel</a>
    </form>
</div></div>
{% endblock %}
