<script>
(function() {
    var prefix = "{{ prefix|escapejs }}";
    var btn = document.getElementById(prefix + 'AiEvaluateBtn');
    if (!btn) return;
    var url = "{{ evaluate_url|escapejs }}";
    var autoRun = {{ ai_compliance_auto_fetch|yesno:"true,false" }};
    var csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
    var statusEl = document.getElementById(prefix + 'ComplianceStatus');
    var summaryEl = document.getElementById(prefix + 'ComplianceSummary');
    var flagsEl = document.getElementById(prefix + 'ComplianceFlags');
    var placeholderEl = document.getElementById(prefix + 'CompliancePlaceholder');
    var running = false;

    function badgeClass(severity) {
        if (severity === 'green') return 'bg-success';
        if (severity === 'red') return 'bg-danger';
        return 'bg-warning text-dark';
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function renderFlags(flags) {
        if (!flagsEl) return;
        if (!flags || !flags.length) {
            flagsEl.innerHTML = '<p class="text-muted small mb-0">No flags returned.</p>';
            return;
        }
        flagsEl.innerHTML = flags.map(function(flag) {
            var sev = flag.severity || 'amber';
            var cat = escapeHtml((flag.category || 'general').toUpperCase());
            var title = escapeHtml(flag.title || 'Flag');
            var detail = flag.detail ? '<div class="ai-eval-flag-detail">' + escapeHtml(flag.detail) + '</div>' : '';
            return '<div class="ai-eval-flag ai-eval-flag--' + sev + ' mb-2">' +
                '<div class="d-flex justify-content-between align-items-start gap-2">' +
                '<div class="ai-eval-flag-title">' + title + '</div>' +
                '<span class="badge ' + badgeClass(sev) + ' text-uppercase" style="font-size:0.6rem;">' + cat + '</span>' +
                '</div>' + detail + '</div>';
        }).join('');
    }

    function renderEvaluation(ev) {
        if (placeholderEl) placeholderEl.remove();
        if (statusEl) {
            statusEl.classList.remove('d-none');
            var when = (ev.generated_at || '').slice(0, 16).replace('T', ' ');
            var suffix = ev.from_cache ? ' (cached)' : '';
            statusEl.textContent = when ? ('Checked ' + when + suffix) : 'Check complete.';
        }
        if (summaryEl) {
            summaryEl.classList.remove('d-none');
            summaryEl.textContent = ev.summary || '';
        }
        renderFlags(ev.flags || []);
    }

    function runEvaluation(force) {
        if (running) return;
        running = true;
        btn.disabled = true;
        var origHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Checking…';
        if (statusEl) {
            statusEl.classList.remove('d-none');
            statusEl.textContent = 'Running compliance check…';
        }

        var fd = new FormData();
        fd.append('csrfmiddlewaretoken', csrf);
        if (force) fd.append('force', '1');

        fetch(url, { method: 'POST', headers: { 'X-CSRFToken': csrf }, body: fd })
            .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
            .then(function(res) {
                var data = res.data || {};
                if (!res.ok || !data.ok) {
                    if (statusEl) statusEl.textContent = '';
                    if (typeof toastr !== 'undefined') toastr.error(data.error || 'Compliance check failed.');
                    return;
                }
                renderEvaluation(data.evaluation || {});
            })
            .catch(function() {
                if (statusEl) statusEl.textContent = '';
                if (typeof toastr !== 'undefined') toastr.error('Network error.');
            })
            .finally(function() {
                running = false;
                btn.disabled = false;
                btn.innerHTML = origHtml;
            });
    }

    btn.addEventListener('click', function() { runEvaluation(true); });

    var hasRenderedFlags = flagsEl && flagsEl.querySelector('.ai-eval-flag');
    if (autoRun) {
        runEvaluation(false);
    }
})();
</script>
