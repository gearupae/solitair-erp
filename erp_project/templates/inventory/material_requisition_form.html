{% extends 'base.html' %}
{% block content %}
<div class="page-header mb-4"><h4 class="fw-bold">{{ title }}</h4></div>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <h6 class="mt-3">Lines</h6>
            {{ formset.management_form }}
            {% for f in formset %}{{ f.as_p }}{% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'inventory:material_requisition_list' %}" class="btn btn-light">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
