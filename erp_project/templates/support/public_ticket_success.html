{% extends 'minimal_public.html' %}

{% block title %}Support request received{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 text-center">
    <div class="card-body p-5">
        <div class="text-success mb-3"><i class="fas fa-check-circle fa-3x"></i></div>
        <h1 class="h4 fw-bold mb-2">Thank you</h1>
        <p class="text-muted mb-3">Your support request has been submitted.</p>
        <p class="mb-0 fw-semibold">Reference: {{ ticket.ticket_number }}</p>
        <p class="small text-muted mt-4 mb-0">Our team will review your request and get back to you.</p>
    </div>
</div>
{% endblock %}
