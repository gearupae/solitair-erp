{% extends 'base.html' %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
                <li class="breadcrumb-item"><a href="{% url 'mes:index' %}">Manufacturing</a></li>
                <li class="breadcrumb-item active">Product Templates</li>
            </ol>
        </nav>
        <h4 class="mb-0 fw-bold">{{ title }}</h4>
    </div>
    <a href="{% url 'mes:product_template_create' %}" class="btn btn-primary"><i class="fas fa-plus me-1"></i>New</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table mb-0 align-middle">
            <thead class="table-light">
                <tr><th>Code</th><th>Name</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
                {% for t in templates %}
                <tr>
                    <td class="fw-medium"><a href="{% url 'mes:product_template_detail' t.pk %}">{{ t.code }}</a></td>
                    <td>{{ t.name }}</td>
                    <td class="text-end">
                        <a href="{% url 'mes:product_template_edit' t.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center py-4 text-muted">No templates yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
