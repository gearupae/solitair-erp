{# Shared soft-delete modal — include once per page; call mesOpenDeleteModal(url, label) from buttons. #}
<div class="modal fade" id="mesDeleteModal" tabindex="-1" aria-labelledby="mesDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="post" id="mesDeleteForm" action="#">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title" id="mesDeleteModalLabel">Confirm remove</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Remove <strong id="mesDeleteLabel"></strong>? This deactivates the record; it is not permanently deleted.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">Remove</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
function mesOpenDeleteModal(url, label) {
    document.getElementById('mesDeleteForm').action = url;
    document.getElementById('mesDeleteLabel').textContent = label;
}
</script>
