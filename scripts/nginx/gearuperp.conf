# Nginx site for Gearup ERP — copy to /etc/nginx/sites-enabled/gearuperp on the server.
# Phone camera photos exceed the default 1 MB limit without client_max_body_size.

server {
    listen 80 default_server;
    server_name _ 89.167.54.227 gear.telldb.com;
    root /var/www/gearuperp/erp_project;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/gearuperp/erp_project/staticfiles/;
    }

    location /media/ {
        alias /var/www/gearuperp/erp_project/media/;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
