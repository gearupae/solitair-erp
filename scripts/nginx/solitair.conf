# Nginx site for Solitair ERP on 178.105.89.41

map $http_host $upstream_host {
    default $http_host;
    "" 178.105.89.41;
    "_" 178.105.89.41;
}

server {
    listen 80 default_server;
    server_name 178.105.89.41 solitair.telldb.com www.solitair.telldb.com;
    root /var/www/solitair/erp_project;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/solitair/erp_project/staticfiles/;
    }

    location /media/ {
        alias /var/www/solitair/erp_project/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
